<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Service WebSocket Test</title>
</head>

<body>

<h2>Vehicle Service AI WebSocket Test</h2>

<label>JWT Token:</label>
<br>
<input
    id="token"
    type="text"
    placeholder="Paste your JWT token here"
    style="width: 600px;"
>

<br><br>

<label>Session ID:</label>
<br>
<input
    id="sessionId"
    type="number"
    value="1"
>

<br><br>

<button onclick="connectWebSocket()">
    Connect
</button>

<br><br>

<input
    id="question"
    type="text"
    placeholder="Enter your question"
    style="width: 500px;"
>

<button onclick="sendMessage()">
    Send
</button>

<h3>Response</h3>

<pre id="output"></pre>


<script>

let socket = null;


function log(message) {
    const output = document.getElementById("output");

    output.textContent +=
        message + "\n\n";
}


function connectWebSocket() {

    const token =
        document.getElementById("token").value.trim();

    const sessionId =
        document.getElementById("sessionId").value;

    if (!token) {
        alert("Please enter your JWT token.");
        return;
    }

    const url =
        `ws://127.0.0.1:8000/ws/chat/${sessionId}?token=${encodeURIComponent(token)}`;

    socket = new WebSocket(url);


    socket.onopen = function() {
        log("WebSocket connected.");
    };


    socket.onmessage = function(event) {

        const data =
            JSON.parse(event.data);

        log(
            JSON.stringify(
                data,
                null,
                2
            )
        );
    };


    socket.onerror = function() {
        log("WebSocket error.");
    };


    socket.onclose = function(event) {

        log(
            `WebSocket disconnected. Code: ${event.code}`
        );
    };
}


function sendMessage() {

    if (!socket || socket.readyState !== WebSocket.OPEN) {

        alert(
            "Connect to the WebSocket first."
        );

        return;
    }


    const question =
        document.getElementById("question")
            .value
            .trim();


    if (!question) {

        alert(
            "Please enter a question."
        );

        return;
    }


    socket.send(
        JSON.stringify({
            question: question
        })
    );
}

</script>

</body>
</html>
